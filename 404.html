<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>@font-face{font-family:B;src:url(/assets/fonts/bricolage.woff2)}@font-face{font-family:M;src:url(/assets/fonts/jetbrains-mono.woff2)}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06080b;color:#e9eef3;font-family:M,monospace;text-align:center}
h1{font-family:B,sans-serif;font-size:clamp(90px,20vw,240px);margin:0;line-height:.9;letter-spacing:-.06em;background:linear-gradient(100deg,#ffb627,#b18cff,#4de1ff);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#8a96a3}a{display:inline-block;margin-top:24px;color:#120b00;background:#ffb627;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:700}
.map{display:grid;grid-template-columns:repeat(11,14px);gap:3px;justify-content:center;margin:28px auto}.map i{width:14px;height:14px;background:#1c232c;border-radius:2px}.map i.x{background:#ff5d6c;box-shadow:0 0 12px #ff5d6c}</style></head>
<body><main><h1>404</h1><p>Die not found — this location failed wafer probe.</p><div class="map" id="m"></div><a href="/">← Back to the bench</a></main>
<script>const m=document.getElementById('m');for(let i=0;i<99;i++){const r=Math.hypot(i%11-5,Math.floor(i/11)-4);const e=document.createElement('i');if(r>5.3)e.style.visibility='hidden';if(i===48)e.className='x';m.appendChild(e)}</script></body></html>
